<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Intel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --surface:#fff; --ink:#101a33; --muted:#5b6781; --line:#dbe1ed;
  --accent:#3340f2; --accent-soft:#e8eaff; --signal:#ffc233; --ok:#0e9f6e; --bad:#d92d4a;
  --font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}

/* rail */
.rail{background:var(--ink);color:#e9edf8;padding:26px 22px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{font:700 21px/1.1 var(--display);letter-spacing:-.01em}
.brand small{display:block;font:400 12.5px var(--font);color:#9aa6c6;margin-top:6px;letter-spacing:0}
.steps{list-style:none;margin:6px 0 0;padding:0;position:relative}
.steps:before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:#2a3868}
.step{position:relative;display:flex;gap:14px;align-items:flex-start;padding:9px 0;background:none;border:0;width:100%;text-align:left;cursor:default;color:#8e9bbf}
.step .dot{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);border:2px solid #2a3868;display:grid;place-items:center;font:600 12px var(--font);z-index:1;transition:.2s}
.step b{display:block;font-weight:600;font-size:14.5px;color:inherit}
.step span.d{display:block;font-size:12.5px;color:#7885aa}
.step.can{cursor:pointer;color:#dbe2f5}
.step.can:hover b{text-decoration:underline}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur{color:#fff}
.step.cur .dot{background:var(--signal);border-color:var(--signal);color:var(--ink);box-shadow:0 0 0 6px rgba(255,194,51,.18)}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.tally div{background:#18244a;border-radius:12px;padding:10px 12px}
.tally strong{display:block;font:700 22px/1 var(--display);color:#fff}
.tally span{font-size:12px;color:#9aa6c6}
.railbtns{display:flex;gap:8px;flex-wrap:wrap}
.railbtns button{flex:1;background:#18244a;border:1px solid #2a3868;color:#e9edf8;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px}
.railbtns button:hover{background:#22306a}

/* main */
main{padding:38px clamp(18px,4vw,56px) 120px;max-width:1240px;width:100%}
h1{font:700 clamp(28px,3.4vw,40px)/1.08 var(--display);letter-spacing:-.02em;margin:0 0 10px}
h2{font:700 22px/1.2 var(--display);letter-spacing:-.01em;margin:0 0 6px}
h3{font:600 16px/1.3 var(--font);margin:0 0 6px}
.lede{color:var(--muted);max-width:66ch;margin:0 0 26px;font-size:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.panel+.panel{margin-top:18px}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:14px}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:6px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;font-weight:400;font-size:15px}
label>textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.hint{font-weight:400;color:var(--muted);font-size:12.5px;margin-top:5px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.btn{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:11px;cursor:pointer;font-weight:600;font-size:14.5px;transition:.15s}
.btn:hover{border-color:#b9c3dc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2531d8}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon{background:none;border:0;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 7px;border-radius:8px}
.icon:hover{background:#f0f2f8;color:var(--bad)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:#eef0f7;color:var(--muted);vertical-align:middle;margin-left:6px;white-space:nowrap}
.pill.direct{background:#e6f6ef;color:#0b7a55}
.pill.indirect{background:#fff4d6;color:#8a6200}
.pill.ok{background:#e6f6ef;color:#0b7a55}
.pill.warn{background:#fff4d6;color:#8a6200}
.pill.video{background:#e4e8ff;color:#2b36c9}
.pill.static{background:#f3e8ff;color:#7c3aed}
.pill.carousel{background:#ffe9d9;color:#c2410c}
.pill.none{background:#eef0f7;color:#7a8499}
.err{background:#fdecef;border:1px solid #f3b8c3;color:#8f1d33;padding:12px 16px;border-radius:12px;margin-bottom:18px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.err button{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:inherit}
.notice{background:var(--accent-soft);border:1px solid #cdd2ff;padding:12px 16px;border-radius:12px;margin-bottom:18px;font-size:14px}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.scroll{overflow-x:auto}

/* scan progress */
.scanstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.scanstrip span{font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.scanstrip span.done{background:#e6f6ef;border-color:#bfe7d3;color:#0b7a55}
.scanstrip span.run{background:#fff8e1;border-color:#ffe08a;color:#7a5a00}

/* sub nav */
.subnav{position:sticky;top:0;z-index:6;background:rgba(238,241,246,.93);backdrop-filter:blur(8px);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;border-bottom:1px solid var(--line)}
.subnav button,.chip{display:inline-block;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}
.subnav button:hover,.chip:hover{border-color:var(--accent);color:var(--accent)}
.sec{margin-top:34px;scroll-margin-top:64px}
.sec:first-of-type{margin-top:0}
.sec>p.hint{margin:0 0 14px;font-size:14px}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th{background:#f6f8fc;text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#fafbfe}
.tbl .cname{font-weight:600;font-size:15px}
.tbl .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tbl .price{font:700 16px var(--display);margin-bottom:2px}
.tbl ul{margin:0;padding-left:16px}
.tbl li{margin-bottom:3px}
.tbl a.lnk,.lnk{color:var(--accent);text-decoration:none;font-weight:500}
.tbl a.lnk:hover,.lnk:hover{text-decoration:underline}
.alink{display:inline-flex;gap:5px;align-items:center;margin:0 6px 6px 0;padding:4px 10px;border-radius:99px;border:1px solid #bfe7d3;background:#f1fbf6;color:#0b7a55;font-size:12.5px;font-weight:600;text-decoration:none}
.alink:hover{background:#e0f6ea}
.alink.search{border-color:#ffe08a;background:#fffaea;color:#7a5a00}
.alink.search:hover{background:#fff3cc}
.alink.un{border-color:#d3d9e8;background:#f6f8fc;color:#33405f}
.alink.un:hover{background:#eceff7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:140px;font-weight:600}
.cmp th:first-child{background:#f6f8fc}
.cmp td{min-width:170px;font-size:13.5px}
.cmp td.us{background:var(--accent-soft)}
.cmp th.us{background:#dfe2ff;color:#2b36c9}
.vdot{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-bottom:5px}
.v-better{background:#d7f3e5;color:#0b7a55}
.v-similar{background:#e9ecf5;color:#4a5876}
.v-worse{background:#ffe3e8;color:#a3243f}
.v-unknown{background:#eef0f7;color:#7a8499}
.twocol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:16px}
.twocol>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.twocol ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.twocol li{margin-bottom:6px}

/* competitor manager */
.mgr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mgr .tag{display:inline-flex;gap:2px;align-items:center;padding:3px 4px 3px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.addrow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:14px}
.addrow label{margin:0}

/* details */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.acc{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;scroll-margin-top:70px}
.acc.flash{box-shadow:0 0 0 3px #ffd75e}
.acc>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;cursor:pointer}
.acc>header:hover{background:#fafbfe}
.acc .body{padding:4px 20px 20px;border-top:1px solid var(--line)}
.res{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.res section{background:#f6f8fc;border-radius:12px;padding:14px 16px}
.res section.wide{grid-column:1/-1}
.res h4{margin:0 0 8px;font:600 14px var(--font)}
.res ul{margin:0;padding-left:18px}
.res li{margin-bottom:6px;font-size:14px}
.res li small{color:var(--muted);display:block}
.adrow{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.adrow:last-child{border-bottom:0}
.drop{border:2px dashed #c5cde0;border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;background:#fbfcfe}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(16,26,51,.8);color:#fff;cursor:pointer;line-height:1}
.opts{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.opts label{display:flex;gap:9px;align-items:center;margin:0;font-weight:500}
.opts input{width:18px;height:18px;accent-color:var(--accent)}

/* ideas */
.idea{display:grid;grid-template-columns:34px 1fr;gap:12px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c,#8a95b3);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.idea.sel{background:var(--accent-soft);border-color:#cdd2ff;border-left-color:var(--c,var(--accent))}
.idea>input{width:20px;height:20px;accent-color:var(--accent);margin-top:3px}
.idea .tag{font-size:12px;font-weight:600;color:var(--c,var(--muted))}
.idea p{margin:4px 0;font-size:14.5px}
.idea .meta{color:var(--muted);font-size:13.5px}
.cat-USP{--c:#3340f2}.cat-Format{--c:#c2410c}.cat-Hook{--c:#7c3aed}.cat-Offer{--c:#0e9f6e}.cat-Proof{--c:#0369a1}.cat-Emotion{--c:#be185d}
.pbox{margin-top:10px;background:#101a33;color:#e9edf8;border-radius:12px;padding:12px 14px}
.pbox .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;color:#9aa6c6;font-weight:600}
.pbox pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;max-height:150px;overflow:auto}
.pbox.open pre{max-height:none}
.pbox .btn{background:#18244a;border-color:#2a3868;color:#fff}
.pbox .btn.cp{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.sticky{position:fixed;left:288px;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px clamp(18px,4vw,56px);display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:5}
.concept{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.concept .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hook{font:600 17px/1.35 var(--display);margin:10px 0;padding:12px 16px;background:#fff8e1;border-left:4px solid var(--signal);border-radius:0 10px 10px 0}
.script{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.script th{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
.script td{padding:8px;border-bottom:1px solid #eef0f6;vertical-align:top}
.script td:first-child{white-space:nowrap;font-weight:600}
.copyblock{background:#f6f8fc;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:10px}
.exports{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}

/* overlays */
#overlay{position:fixed;inset:0;background:rgba(16,26,51,.55);display:none;place-items:center;z-index:30;padding:18px}
#overlay.on{display:grid}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:26px}
.modal h2{margin-bottom:14px}
.working{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;z-index:20;min-width:300px;max-width:92vw;box-shadow:0 12px 36px rgba(16,26,51,.35);display:none}
.working.on{display:block}
.working .wrow{display:flex;gap:14px;justify-content:space-between;align-items:center}
.working .btn{background:#18244a;border-color:#2a3868;color:#fff}
.working .bar{height:5px;background:#2a3868;border-radius:9px;margin-top:9px;overflow:hidden}
.working .bar i{display:block;height:100%;background:var(--signal);transition:width .3s}
.working small{color:#9aa6c6;display:block}
#toast{position:fixed;top:18px;right:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:40;opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:none}
.proj{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:12px}
  .brand small,.tally,.step span.d,.steps:before{display:none}
  .steps{display:flex;gap:4px;margin:0;flex:1 1 100%;order:3;overflow:auto}
  .step{padding:4px 8px;width:auto;align-items:center;gap:8px}
  .step b{font-size:13px;white-space:nowrap}
  .railbtns{margin-left:auto;flex:none}
  .grid2,.grid3,.res,.twocol,.addrow{grid-template-columns:1fr}
  .sticky{left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  .rail,.sticky,.exports,.working,.btn,.icon,.actions,#toast,.subnav,.drop{display:none!important}
  .app{display:block}body{background:#fff}main{padding:0;max-width:none}
  .concept,.idea,.panel,.acc{break-inside:avoid}
  .acc .body{display:block!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
</div>
<div id="overlay"></div>
<div class="working" id="working" role="status" aria-live="polite"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { try { const x = new URL(String(u).trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
const host = u => { try { return new URL(/^https?:/.test(u) ? u : 'https://' + u).hostname.replace(/^www\./, '').toLowerCase(); } catch { return ''; } };
const uid = () => Math.random().toString(36).slice(2, 10);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const arr = x => Array.isArray(x) ? x : [];
const tx = (x, ...keys) => { if (x == null) return ''; if (typeof x === 'string') return x; for (const k of keys) if (x[k]) return String(x[k]); return ''; };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const DEFAULT_MODEL = 'gemini-3.1-pro-preview';

/* ================= state ================= */
let settings = {};
try { settings = JSON.parse(lsGet('mis2_settings') || '{}'); } catch {}
const newState = () => ({
  id: uid(), step: 1, maxStep: 1,
  biz: { name: '', url: '', course: '', desc: '', price: '', audience: '', country: 'IN', lang: 'English' },
  profile: null, competitors: [], research: {}, ads: {}, comparison: null,
  ideas: [], selected: [], concepts: {}, opts: { pain: true, count: 6 }, scanned: false
});
let S = newState();
let T = { newName: '', newWeb: '' };
let IMAGES = {};
let UI = { busy: null, error: '', open: {}, drawer: null, scan: null, promptOpen: {} };
let STOPPED = false, CTL = null;

let saveTimer;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
function save() {
  if (!S.biz.name && S.step === 1) return;
  try {
    const list = JSON.parse(lsGet('mis2_projects') || '[]');
    const snap = JSON.parse(JSON.stringify(S)); snap.updated = Date.now();
    const i = list.findIndex(p => p.id === S.id);
    if (i >= 0) list[i] = snap; else list.unshift(snap);
    lsSet('mis2_projects', JSON.stringify(list.slice(0, 25)));
    lsSet('mis2_last', S.id);
  } catch {}
}
function loadLast() {
  try {
    const list = JSON.parse(lsGet('mis2_projects') || '[]');
    const p = list.find(x => x.id === lsGet('mis2_last'));
    if (p) S = Object.assign(newState(), p);
  } catch {}
}

/* ================= Gemini client ================= */
const SYS = `You are a senior performance-marketing strategist and market researcher who works with Indian edtech and online-learning brands (JEE, NEET, UPSC, upskilling, online degrees, IIT/IIM-branded programs). Be specific, practical and evidence-based. Never invent facts, prices, ads, statistics, quotes or URLs. If something is unknown or unverified, say so plainly. When asked for JSON, return only valid JSON with no commentary and no markdown fences.`;

function friendly(status, msg, raw) {
  if (status === 504 || /FUNCTION_INVOCATION_TIMEOUT|timed out/i.test(raw || '')) return 'The request took too long. Retry, or set a faster model under Research model in Settings.';
  if (status === 401) return 'Access code not accepted. Open Settings and re-enter it.';
  if (status === 404 && !settings.ownKey && !/models\//i.test(raw || '')) return 'No server found at /api/gemini. Deploy to Vercel, or add your own Gemini key in Settings.';
  if (status === 429) return 'Gemini rate limit reached. Wait a minute and retry.';
  return msg;
}
async function gemini({ parts, tools = [], kind = 'main' }) {
  const body = {
    contents: [{ role: 'user', parts }],
    systemInstruction: { parts: [{ text: SYS }] },
    generationConfig: { maxOutputTokens: 32000 }
  };
  if (tools.length) body.tools = tools;
  const model = ((kind === 'research' ? settings.researchModel : '') || settings.model || '').trim();
  let lastErr;
  for (let a = 0; a < 4; a++) {
    if (STOPPED) throw Object.assign(new Error('Stopped.'), { cancelled: true });
    if (!CTL || CTL.signal.aborted) CTL = new AbortController();
    let r;
    try {
      if (settings.ownKey) {
        r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model || DEFAULT_MODEL}:generateContent`, {
          method: 'POST', signal: CTL.signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': settings.ownKey.trim() }, body: JSON.stringify(body) });
      } else {
        r = await fetch('/api/gemini', { method: 'POST', signal: CTL.signal, headers: { 'Content-Type': 'application/json', 'x-access-code': (settings.code || '').trim() }, body: JSON.stringify({ model, body }) });
      }
    } catch (e) {
      if (e.name === 'AbortError') throw Object.assign(new Error('Stopped.'), { cancelled: true });
      lastErr = new Error('Network error. Check your connection and retry.');
      if (a < 3) { await sleep(1500 * (a + 1)); continue; }
      throw lastErr;
    }
    const raw = await r.text(); let j = null; try { j = JSON.parse(raw); } catch {}
    if (r.ok && j) return parseResp(j);
    const msg = j?.error?.message || raw.slice(0, 180) || ('HTTP ' + r.status);
    lastErr = new Error(friendly(r.status, msg, raw));
    if ([429, 500, 502, 503].includes(r.status) && a < 3) { await sleep(2500 * (a + 1)); continue; }
    throw lastErr;
  }
  throw lastErr;
}
function parseResp(j) {
  const c = j.candidates?.[0];
  if (!c) throw new Error(j.promptFeedback?.blockReason ? 'Gemini blocked this request (' + j.promptFeedback.blockReason + ').' : 'Gemini returned an empty answer. Retry.');
  const text = (c.content?.parts || []).filter(p => p.text && !p.thought).map(p => p.text).join('');
  const sources = (c.groundingMetadata?.groundingChunks || []).map(x => x.web).filter(Boolean).map(w => ({ url: w.uri, title: w.title || '' }));
  if (!text.trim()) throw new Error('Gemini returned an empty answer. Retry.');
  return { text, sources };
}
function matchEnd(t, i) {
  const open = t[i], close = open === '{' ? '}' : ']';
  let d = 0, inS = false, es = false;
  for (let k = i; k < t.length; k++) {
    const c = t[k];
    if (inS) { if (es) es = false; else if (c === '\\') es = true; else if (c === '"') inS = false; continue; }
    if (c === '"') { inS = true; continue; }
    if (c === open) d++; else if (c === close) { d--; if (d === 0) return k; }
  }
  return -1;
}
function extractJSON(t) {
  t = String(t).replace(/```json|```/gi, '');
  let best = null;
  for (let i = 0; i < t.length; i++) {
    if (t[i] !== '{' && t[i] !== '[') continue;
    const end = matchEnd(t, i); if (end < 0) continue;
    const s = t.slice(i, end + 1);
    for (const cand of [s, s.replace(/,\s*([}\]])/g, '$1')]) {
      try {
        const v = JSON.parse(cand);
        if (v && typeof v === 'object' && (Array.isArray(v) ? v.length && v.every(x => x && typeof x === 'object') : Object.keys(v).length)) {
          if (!best || s.length > best.len) best = { v, len: s.length };
          i = end; break;
        }
      } catch {}
    }
  }
  if (!best) throw new Error('no json');
  return best.v;
}
async function askJSON(opts) {
  let r;
  try { r = await gemini(opts); }
  catch (e) {
    if (!e.cancelled && arr(opts.tools).length > 1 && /tool|url_context|urlContext|not supported|invalid/i.test(e.message)) r = await gemini({ ...opts, tools: opts.tools.filter(t => t.googleSearch) });
    else throw e;
  }
  try { return { data: extractJSON(r.text), sources: r.sources }; }
  catch {
    const r2 = await gemini({ parts: [{ text: 'Convert the following into valid JSON only (no commentary, no markdown), keeping all content:\n\n' + r.text }] });
    return { data: extractJSON(r2.text), sources: r.sources };
  }
}
async function pool(items, n, fn) {
  const q = [...items];
  await Promise.all(Array.from({ length: Math.min(n, q.length) }, async () => { while (q.length) await fn(q.shift()); }));
}
async function checkLinks(urls) {
  urls = [...new Set(urls.filter(Boolean))].slice(0, 40);
  if (!urls.length || settings.ownKey || !settings.code) return {};
  try {
    const r = await fetch('/api/check', { method: 'POST', signal: CTL?.signal, headers: { 'Content-Type': 'application/json', 'x-access-code': settings.code.trim() }, body: JSON.stringify({ urls }) });
    if (!r.ok) return {};
    return (await r.json()).results || {};
  } catch { return {}; }
}

const PLATFORMS = ['youtube.com', 'youtu.be', 'facebook.com', 'fb.watch', 'fb.com', 'instagram.com', 'linkedin.com', 'x.com', 'twitter.com', 'adstransparency.google.com', 'pinterest.com', 't.me'];
const sameSite = (h, d) => h === d || h.endsWith('.' + d);
function domainOK(url, c, sources) {
  const h = host(url); if (!h || /vertexaisearch|googleusercontent/.test(h)) return false;
  if (c.website && sameSite(h, host(c.website))) return true;
  if (PLATFORMS.some(p => sameSite(h, p))) return true;
  return sources.some(s => { const t = String(s.title || '').toLowerCase().replace(/^www\./, ''); return t && (h === t || h.endsWith('.' + t) || t.endsWith('.' + h)); });
}

async function researchComp(c) {
  S.research[c.id] = { ...(S.research[c.id] || {}), status: 'running' };
  const a = S.ads[c.id] || { notes: '' };
  const notes = (a.notes || '').trim();
  const imgs = IMAGES[c.id] || [];
  const prompt = `${bizContext()}

COMPETITOR: ${c.name} (${c.website || 'website unknown'}) - ${c.why}
Their closest course to ours (if known): ${c.course || 'unknown'}
Evidence supplied by the user (ad copy, links, notes): ${notes || '(none)'}
Screenshots attached: ${imgs.length}

Research how this competitor sells a course similar to ours and how they advertise it. Use Google Search and read their course and pricing pages.
1. Their closest course: name, the page URL you actually opened or saw, the price or offer price as shown on the page (say "Not shown" if absent), duration, mode, key features.
2. Their ads for this kind of course. Look for Meta (Facebook and Instagram) ad library entries, YouTube ads or promo videos, Google ads, LinkedIn or Instagram posts, and landing pages used in ads. For each ad found give the platform, format (video, static or carousel), what it shows or says, and the USPs it pushes. Give a URL ONLY if you saw that exact URL in search results or on a page you read. Never guess or construct URLs, video IDs or ad IDs. If you cannot find specific ads, return an empty ads array and say so in confidence_note.
3. Overall: USPs pushed in their advertising, creative types, hooks, offers and CTAs, what students expect, and pain points addressed.
Return JSON:
{"course":{"name":"","url":"","price":"","price_note":"e.g. EMI, discount, validity","duration":"","mode":"","features":[""]},
"positioning":"one line",
"ads":[{"platform":"Meta or YouTube or Google or Instagram or LinkedIn or Website","format":"video or static or carousel","what":"what it shows or says","usps":[""],"url":""}],
"ad_usps":[{"usp":"","where_seen":""}],
"creative_types":[{"type":"","description":""}],
"hooks":[""],"offers_ctas":[""],"student_expectations":[""],"pain_points":[""],
"confidence_note":"how reliable and complete this is"}`;
  const parts = [{ text: prompt }, ...imgs.map(i => ({ inlineData: { mimeType: i.mime, data: i.data } }))];
  const { data: d, sources } = await askJSON({ parts, tools: [{ urlContext: {} }, { googleSearch: {} }], kind: 'research' });
  const srcs = sources.map(s => ({ url: safeUrl(s.url), title: s.title })).filter(s => s.url);
  const course = d.course || {};
  const courseUrl = safeUrl(course.url) && domainOK(course.url, c, srcs) ? safeUrl(course.url) : '';
  const ads = arr(d.ads).map(x => ({ platform: String(x.platform || ''), format: normFmt(x.format), what: String(x.what || ''), usps: arr(x.usps).map(u => tx(u, 'usp', 'text')).filter(Boolean), url: safeUrl(x.url) && domainOK(x.url, c, srcs) ? safeUrl(x.url) : '', status: 'unchecked' })).slice(0, 8);
  const notesUrls = (notes.match(/https?:\/\/[^\s)>\]]+/g) || []).map(safeUrl).filter(Boolean);
  notesUrls.forEach(u => { if (!ads.some(x => x.url === u)) ads.push({ platform: host(u).replace(/\.com$/, ''), format: 'unknown', what: 'Link you added', usps: [], url: u, status: 'unchecked', mine: true }); });
  const checks = await checkLinks([courseUrl, ...ads.map(x => x.url)]);
  ads.forEach(x => { if (x.url && checks[x.url]) x.status = checks[x.url].status; });
  const liveAds = ads.filter(x => !(x.url && x.status === 'dead')).map(x => (x.url && x.status === 'dead') ? { ...x, url: '' } : x);
  const courseStatus = courseUrl && checks[courseUrl] ? checks[courseUrl].status : 'unchecked';
  const fm = new Set(liveAds.map(x => x.format).filter(f => f !== 'unknown'));
  S.research[c.id] = {
    status: 'done', course: { name: String(course.name || c.course || ''), url: courseStatus === 'dead' ? '' : courseUrl, price: String(course.price || 'Not shown'), price_note: String(course.price_note || ''), duration: String(course.duration || ''), mode: String(course.mode || ''), features: arr(course.features).map(f => tx(f, 'text')).filter(Boolean) },
    positioning: String(d.positioning || ''), ads: liveAds, formats: [...fm],
    ad_usps: arr(d.ad_usps).map(u => ({ usp: tx(u, 'usp', 'text'), where: u.where_seen || '' })).filter(u => u.usp),
    creative_types: arr(d.creative_types), hooks: arr(d.hooks).map(h => tx(h, 'hook', 'text')), offers_ctas: arr(d.offers_ctas).map(h => tx(h, 'offer', 'text')),
    student_expectations: arr(d.student_expectations).map(h => tx(h, 'text')), pain_points: arr(d.pain_points).map(h => tx(h, 'text')),
    confidence_note: String(d.confidence_note || ''), sources: srcs.slice(0, 8), evidence: (notes || imgs.length) ? 'yours' : 'research'
  };
}

        S.concepts[idea.id] = arr(Array.isArray(data) ? data : data.concepts);
      } catch (e) { if (e.cancelled) throw e; errs.push(e.message); }
      done++; busy('Writing creatives', `${done} of ${ideas.length} ideas done`, done, ideas.length);
    });
  } catch (e) { return fail(e); }
  idle(); render(); saveSoon();
  if (errs.length) fail(new Error(errs[0]));
}

function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const m = 1280, k = Math.min(1, m / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL('image/jpeg', 0.72); URL.revokeObjectURL(u);
      res({ name: file.name, mime: 'image/jpeg', data: url.split(',')[1], url });
    };
    img.onerror = () => rej(new Error('Could not read that image.'));
    img.src = u;
  });
}
async function addImages(id, files) {
  const list = IMAGES[id] = IMAGES[id] || [];
  for (const f of [...files].filter(f => f.type.startsWith('image/'))) {
    if (list.length >= 6) { toast('Up to 6 screenshots per competitor'); break; }
    try { list.push(await compress(f)); } catch (e) { toast(e.message); }
  }
  UI.open[id] = true; render();
}

  if (!text) return '';
  const open = UI.promptOpen[key];
  return `<div class="pbox ${open ? 'open' : ''}"><div class="ph"><span>${esc(label)}</span><span style="display:flex;gap:6px"><button class="btn sm" data-act="togglePrompt" data-key="${esc(key)}">${open ? 'Collapse' : 'Show all'}</button><button class="btn sm cp" data-act="copyPrompt" data-key="${esc(key)}">Copy prompt</button><a class="btn sm" style="text-decoration:none;color:#fff" href="https://chatgpt.com/" target="_blank" rel="noopener">Open ChatGPT ↗</a></span></div><pre>${esc(text)}</pre></div>`;
}
function promptFor(key) {
  const [kind, id, n] = key.split(':');
  if (kind === 'idea') return S.ideas.find(i => i.id === id)?.image_prompt || '';
  if (kind === 'concept') return arr(S.concepts[id])[+n]?.image_prompt || '';
  return '';
}
function conceptText(c) {
  return [`${c.title} (${c.format}${c.platform ? ', ' + c.platform : ''})`, `Hook: ${c.hook}`,
    ...arr(c.script).map(s => `${s.time}: ${s.visual || ''} | VO: ${s.voiceover || ''} | Text: ${s.on_screen_text || ''}`),
    `Headline: ${c.headline}`, `Primary text: ${c.primary_text}`, `CTA: ${c.cta}`, `Why it works: ${c.why_it_works}`, `Test: ${c.test_tip}`,
    c.image_prompt ? `GPT image prompt: ${c.image_prompt}` : ''].filter(Boolean).join('\n');
}

function viewIdeas() {
  const sel = S.ideas.filter(i => S.selected.includes(i.id));
  const has = sel.some(i => arr(S.concepts[i.id]).length);
  if (!S.ideas.length) return `<h1>Ideas and prompts</h1><p class="lede">Ideas are written from the market report.</p><div class="panel"><div class="empty">No ideas yet.<br><br><button class="btn primary" data-act="stageIdeas" ${UI.busy || !S.competitors.length ? 'disabled' : ''}>Write ideas now</button></div></div>`;
  return `
  <h1>Ideas and GPT prompts</h1>
  <p class="lede">${S.ideas.length} ideas based on the report. Each has a ready-to-paste prompt for ChatGPT to make a banner or static image, and shows the competitor ads that inspired it. Tick the ones you want turned into full creative concepts.</p>
  ${S.ideas.map(i => {
    const on = S.selected.includes(i.id);
    return `<div class="idea cat-${esc(i.category)} ${on ? 'sel' : ''}">
      <input type="checkbox" data-act="toggleIdea" data-id="${i.id}" ${on ? 'checked' : ''} aria-label="Select idea">
      <div><span class="tag">${esc(i.category)}${i.format ? ' · ' + esc(i.format) : ''}${i.difficulty ? ' · ' + esc(i.difficulty) + ' to produce' : ''}</span>
        <h3>${esc(i.title)}</h3><p>${esc(i.summary)}</p>
        ${i.why_it_works ? `<p class="meta"><b>Why it works:</b> ${esc(i.why_it_works)}</p>` : ''}
        ${i.fit_for_us ? `<p class="meta"><b>For you:</b> ${esc(i.fit_for_us)}</p>` : ''}
        ${arr(i.who_uses).length ? `<p class="meta"><b>Seen with:</b> ${arr(i.who_uses).map(esc).join(', ')}</p>` : ''}
        ${arr(i.refs).length ? `<div style="margin-top:6px"><span class="hint" style="margin-right:6px">Inspired by:</span>${i.refs.map(r => `<a class="alink ${r.status === 'ok' ? '' : 'un'}" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.comp)} · ${esc(fmtWord(r.format).toLowerCase())} ↗</a>`).join('')}</div>` : ''}
        ${promptBox('idea:' + i.id, i.image_prompt, 'GPT image prompt')}
      </div></div>`;
  }).join('')}
  ${has ? `<div class="exports" style="margin-top:28px"><button class="btn sm" data-act="exportMd">Download report (.md)</button><button class="btn sm" data-act="exportJson">Download data (.json)</button><button class="btn sm" data-act="print">Print or save as PDF</button></div>` : ''}
  ${sel.map(i => arr(S.concepts[i.id]).length ? `
    <div style="margin-top:30px"><h2>Creatives: ${esc(i.title)}</h2><p class="hint" style="font-size:14px;margin:0 0 12px">${esc(i.summary)}</p>
    ${arr(S.concepts[i.id]).map((c, n) => `
      <div class="concept"><div class="top"><div><span class="pill" style="margin:0">${esc(c.format)}</span>${c.platform ? `<span class="pill">${esc(c.platform)}</span>` : ''}<h3 style="margin-top:8px;font-size:18px">${esc(c.title)}</h3></div>
        <button class="btn sm" data-act="copyConcept" data-id="${i.id}" data-i="${n}">Copy concept</button></div>
        <div class="hook">${esc(c.hook)}</div>
        ${arr(c.script).length ? `<div class="scroll"><table class="script"><thead><tr><th>When</th><th>Visual</th><th>Voiceover</th><th>On-screen text</th></tr></thead><tbody>${c.script.map(s => `<tr><td>${esc(s.time)}</td><td>${esc(s.visual)}</td><td>${esc(s.voiceover)}</td><td>${esc(s.on_screen_text)}</td></tr>`).join('')}</tbody></table></div>` : ''}
        <div class="copyblock"><b>Headline:</b> ${esc(c.headline)}<br><b>Primary text:</b> ${esc(c.primary_text)}<br><b>CTA:</b> ${esc(c.cta)}</div>
        <p class="hint" style="margin:10px 0 0"><b>Why it works:</b> ${esc(c.why_it_works)}${c.test_tip ? `<br><b>Test it:</b> ${esc(c.test_tip)}` : ''}</p>
        ${promptBox('concept:' + i.id + ':' + n, c.image_prompt, 'GPT image prompt for this concept')}
      </div>`).join('')}</div>` : '').join('')}
  <div class="sticky"><span><b>${S.selected.length}</b> selected</span>
    <div class="actions" style="margin:0"><label style="margin:0;font-weight:500;display:flex;gap:8px;align-items:center">Concepts per idea <select data-bind="opts.count" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px">${[5, 6, 8].map(n => opt(String(n), String(n), String(S.opts.count))).join('')}</select></label>
    <button class="btn" data-act="selAll">Select all</button><button class="btn" data-act="selNone">Clear</button>
    <button class="btn primary" data-act="genConcepts" ${S.selected.length && !UI.busy ? '' : 'disabled'}>${has ? 'Regenerate' : 'Build'} concepts for ${S.selected.length} idea${S.selected.length === 1 ? '' : 's'}</button></div></div>`;
}

function renderWorking() {
  const w = $('#working'), b = UI.busy;
  if (!b) { w.classList.remove('on'); w.innerHTML = ''; return; }
  const pct = b.total ? Math.round(b.done / b.total * 100) : 12;
  w.innerHTML = `<div class="wrow"><div><b>${esc(b.title)}</b>${b.detail ? `<small>${esc(b.detail)}</small>` : ''}</div><button class="btn sm" data-act="stop">Stop</button></div><div class="bar"><i style="width:${pct}%"></i></div>`;
  w.classList.add('on');
}
function renderOverlay() {
  const o = $('#overlay');
  if (!UI.drawer) { o.classList.remove('on'); o.innerHTML = ''; return; }
  if (UI.drawer === 'settings') {
    o.innerHTML = `<div class="modal" role="dialog" aria-label="Settings"><h2>Settings</h2>
      <label>Access code<input type="password" data-bind="set.code" value="${esc(settings.code || '')}" autocomplete="off" placeholder="The code you set in Vercel"><span class="hint">Used with the hosted version. Your Gemini key stays on the server. Link checking also needs this.</span></label>
      <label>Or use your own Gemini key<input type="password" data-bind="set.ownKey" value="${esc(settings.ownKey || '')}" autocomplete="off" placeholder="AIza..."><span class="hint">Runs directly from this browser and overrides the access code. Ad links will not be checked for liveness in this mode.</span></label>
      <label>Main model<input data-bind="set.model" value="${esc(settings.model || '')}" placeholder="${DEFAULT_MODEL}"><span class="hint">Leave blank for ${DEFAULT_MODEL}.</span></label>
      <label>Research model (optional, faster)<input data-bind="set.researchModel" value="${esc(settings.researchModel || '')}" placeholder="Same as main model"><span class="hint">Used for the per-competitor web research, which is the slow part. Type a faster model name from Google AI Studio if scans time out.</span></label>
      <div class="actions"><button class="btn primary" data-act="closeModal">Save and close</button></div></div>`;
  } else {
    let list = []; try { list = JSON.parse(lsGet('mis2_projects') || '[]'); } catch {}
    o.innerHTML = `<div class="modal" role="dialog" aria-label="History"><h2>Saved research</h2>
      ${list.length ? list.map(p => `<div class="proj"><div><b>${esc(p.biz?.course || p.biz?.name || 'Untitled')}</b><div class="hint">${new Date(p.updated || Date.now()).toLocaleString()} · ${arr(p.competitors).length} competitors · ${arr(p.ideas).length} ideas</div></div>
        <div class="actions" style="margin:0"><button class="btn sm" data-act="loadProj" data-id="${p.id}">Open</button><button class="btn sm" data-act="delProj" data-id="${p.id}">Delete</button></div></div>`).join('') : '<div class="empty">Nothing saved yet. Research is saved on this device automatically.</div>'}
      <div class="actions" style="margin-top:16px"><button class="btn" data-act="closeModal">Close</button></div></div>`;
  }
  o.classList.add('on');
}
function render() { renderRail(); renderMain(); renderWorking(); renderOverlay(); }

/* ================= export ================= */
function toMarkdown() {
  const comps = selComps(); let m = `# Market intel report: ${S.biz.course || S.biz.name}\n\n${S.profile?.summary || ''}\n\n## 1. What competitors are doing\n\n| Competitor | Similar course | Offer price | USPs in ads | Ad type | Ad links |\n|---|---|---|---|---|---|\n`;
  comps.forEach(c => { const r = S.research[c.id]; if (r?.status !== 'done') return; m += `| ${c.name} | ${r.course.name} | ${r.course.price} | ${r.ad_usps.slice(0, 4).map(u => u.usp).join('; ')} | ${r.formats.map(fmtWord).join(', ') || 'Not confirmed'} | ${arr(r.ads).filter(a => a.url).map(a => `[${a.platform} ${a.format}](${a.url})`).join(', ') || `[Search](${metaLink(c)})`} |\n`; });
  if (S.comparison) {
    m += `\n## 2. How we stand out\n\n${S.comparison.summary}\n\n| Dimension | You | ${S.comparison.names.join(' | ')} |\n|---|---|${S.comparison.names.map(() => '---').join('|')}|\n`;
    S.comparison.dimensions.forEach(d => { m += `| ${d.name} | ${d.us} (${d.verdict}) | ${S.comparison.names.map(n => (d.values || {})[n] ?? '-').join(' | ')} |\n`; });
    m += `\n**Where we stand out:** ${arr(S.comparison.we_stand_out).map(x => x.point || x).join('; ')}\n\n**Where they are ahead:** ${arr(S.comparison.they_beat_us).map(x => x.point || x).join('; ')}\n\n**Open space:** ${arr(S.comparison.whitespace).map(x => tx(x, 'text')).join('; ')}\n`;
  }
  m += `\n## 3. Details\n`;
  comps.forEach(c => { const r = S.research[c.id]; if (r?.status !== 'done') return; m += `\n### ${c.name}\n- Positioning: ${r.positioning}\n- Hooks: ${r.hooks.join('; ')}\n- Offers and CTAs: ${r.offers_ctas.join('; ')}\n- Student expectations: ${r.student_expectations.join('; ')}\n- Pain points: ${r.pain_points.join('; ')}\n`; });
  m += `\n## 4. Referenced ads\n` + (allAds().map(a => `- ${a.ref} ${a.comp} · ${a.platform} ${a.format}: ${a.what} ${a.url}`).join('\n') || '- none found');
  S.ideas.forEach(i => { m += `\n\n## Idea: ${i.title}\n${i.summary}\n\nWhy it works: ${i.why_it_works || ''}\n\nInspired by: ${arr(i.refs).map(r => `[${r.comp}](${r.url})`).join(', ') || 'n/a'}\n\nGPT image prompt:\n\n${i.image_prompt || ''}\n`;
    arr(S.concepts[i.id]).forEach((c, n) => { m += `\n### ${n + 1}. ${c.title} (${c.format})\n**Hook:** ${c.hook}\n\n` + arr(c.script).map(s => `- ${s.time}: ${s.visual} | VO: ${s.voiceover} | Text: ${s.on_screen_text}`).join('\n') + `\n\n**Headline:** ${c.headline}\n**Primary text:** ${c.primary_text}\n**CTA:** ${c.cta}\n**GPT image prompt:** ${c.image_prompt || ''}\n`; }); });
  return m;
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function copyText(t) { navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Copy blocked by the browser')); }

/* ================= events ================= */
const actions = {
  goto: d => go(+d.n),
  dismissErr: () => { UI.error = ''; render(); },
  runScan: () => runScan(true),
  stop: () => { STOPPED = true; CTL?.abort(); },
  toggleComp: d => { const c = S.competitors.find(x => x.id === d.id); if (c) { c.selected = !c.selected; S.comparison = null; render(); saveSoon(); } },
  removeComp: d => { S.competitors = S.competitors.filter(x => x.id !== d.id); delete S.research[d.id]; S.comparison = null; render(); saveSoon(); },
  addComp: () => {
    const name = T.newName.trim(); if (!name) return fail(new Error('Enter the competitor name.'));
    const w = T.newWeb.trim() ? safeUrl(/^https?:/.test(T.newWeb.trim()) ? T.newWeb.trim() : 'https://' + T.newWeb.trim()) : '';
    S.competitors.push({ id: uid(), name, website: w, type: 'direct', why: 'Added by you', course: '', selected: true });
    T.newName = T.newWeb = ''; S.comparison = null; UI.error = ''; render(); saveSoon();
  },
  researchNew: () => runStage(async () => { await researchAll(); if (!S.comparison) { scanSet('Comparing you with competitors'); await buildComparison(); } }, 'Researching competitors'),
  moreComps: () => runStage(async () => { await findComps(true); }, 'Finding more competitors'),
  retryComp: d => { const c = S.competitors.find(x => x.id === d.id); if (c) runStage(async () => { await researchComp(c).catch(e => { if (e.cancelled) throw e; S.research[c.id] = { status: 'error', error: e.message }; throw e; }); S.comparison = null; }, 'Researching ' + c.name); },
  stageComparison: () => runStage(buildComparison, 'Comparing you with competitors'),
  stageIdeas: () => runStage(async () => { if (!S.comparison) await buildComparison(); await buildIdeas(); }, 'Writing ideas and image prompts'),
  toggleAcc: d => { UI.open[d.id] = !UI.open[d.id]; render(); },
  jump: (d, e) => { e?.preventDefault?.(); UI.open[d.id] = true; UI.flash = d.id; render(); const el = $('#comp-' + d.id); el?.scrollIntoView?.({ behavior: 'smooth', block: 'start' }); setTimeout(() => { UI.flash = null; $('#comp-' + d.id)?.classList?.remove('flash'); }, 1600); },
  sec: d => { $('#' + d.sec)?.scrollIntoView?.({ behavior: 'smooth', block: 'start' }); },
  pickImg: d => $('#file-' + d.id)?.click(),
  removeImg: d => { (IMAGES[d.id] || []).splice(+d.i, 1); render(); },
  copyLinks: () => copyText(allAds().map(a => `${a.comp} (${a.platform} ${a.format}): ${a.url}`).join('\n')),
  toggleIdea: d => { const i = S.selected.indexOf(d.id); i >= 0 ? S.selected.splice(i, 1) : S.selected.push(d.id); render(); saveSoon(); },
  selAll: () => { S.selected = S.ideas.map(i => i.id); render(); saveSoon(); },
  selNone: () => { S.selected = []; render(); saveSoon(); },
  genConcepts,
  togglePrompt: d => { UI.promptOpen[d.key] = !UI.promptOpen[d.key]; render(); },
  copyPrompt: d => copyText(promptFor(d.key)),
  copyConcept: d => { const c = arr(S.concepts[d.id])[+d.i]; if (c) copyText(conceptText(c)); },
  exportMd: () => download(`${S.biz.course || S.biz.name || 'report'}-market-intel.md`, toMarkdown(), 'text/markdown'),
  exportJson: () => download(`${S.biz.course || S.biz.name || 'report'}-market-intel.json`, JSON.stringify(S, null, 2), 'application/json'),
  print: () => window.print(),
  openSettings: () => { UI.drawer = 'settings'; renderOverlay(); },
  openHistory: () => { save(); UI.drawer = 'history'; renderOverlay(); },
  closeModal: () => { UI.drawer = null; lsSet('mis2_settings', JSON.stringify(settings)); render(); },
  loadProj: d => { const list = JSON.parse(lsGet('mis2_projects') || '[]'); const p = list.find(x => x.id === d.id); if (p) { S = Object.assign(newState(), p); IMAGES = {}; UI = { busy: null, error: '', open: {}, drawer: null, scan: null, promptOpen: {} }; lsSet('mis2_last', S.id); render(); } },
  delProj: d => { const list = JSON.parse(lsGet('mis2_projects') || '[]').filter(x => x.id !== d.id); lsSet('mis2_projects', JSON.stringify(list)); if (d.id === S.id) S = newState(); IMAGES = {}; render(); },
  newProj: () => { save(); S = newState(); IMAGES = {}; UI = { busy: null, error: '', open: {}, drawer: null, scan: null, promptOpen: {} }; render(); }
};

document.addEventListener('click', e => {
  if (e.target === $('#overlay')) return actions.closeModal();
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.tagName === 'INPUT' && b.type === 'checkbox') { actions[b.dataset.act]?.(b.dataset, e); return; }
  if (b.tagName === 'A' && b.getAttribute('href') !== '#') return;
  actions[b.dataset.act]?.(b.dataset, e);
});
function bind(e) {
  const t = e.target, k = t.dataset?.bind; if (!k) return;
  const v = t.type === 'checkbox' ? t.checked : t.value;
  const [root, ...path] = k.split('.');
  let obj = root === 't' ? T : root === 'set' ? settings : S;
  if (root !== 't' && root !== 'set') path.unshift(root);
  const last = path.pop(); for (const p of path) obj = obj[p] = obj[p] || {};
  obj[last] = last === 'count' ? Number(v) : v;
  if (root === 'set') lsSet('mis2_settings', JSON.stringify(settings)); else saveSoon();
  if ((t.type === 'checkbox' || t.tagName === 'SELECT') && k.startsWith('opts.')) renderMain();
}
document.addEventListener('input', bind);
document.addEventListener('change', e => {
  const f = e.target.dataset?.file; if (f) { addImages(f, e.target.files); e.target.value = ''; return; }
  bind(e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-bind="t.newName"],[data-bind="t.newWeb"]')) { e.preventDefault(); actions.addComp(); }
  if (e.key === 'Escape' && UI.drawer) actions.closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.drop')) { e.preventDefault(); e.target.click(); }
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); z.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer?.files?.length) addImages(z.dataset.drop, e.dataTransfer.files);
}));
document.addEventListener('paste', e => {
  const openId = Object.keys(UI.open).find(k => UI.open[k]); if (S.step !== 2 || !openId) return;
  if (e.target.matches('textarea,input') && !e.clipboardData.files.length) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) { e.preventDefault(); const z = document.activeElement?.closest?.('[data-drop]'); addImages(z ? z.dataset.drop : openId, files); }
});

/* ================= boot ================= */
loadLast(); render();
</script>
</body>
</html>
